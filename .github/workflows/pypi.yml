name: Publish PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve package metadata
        id: package_meta
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          name = pyproject["project"]["name"]
          version = pyproject["project"]["version"]
          should_publish = True

          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=20) as response:
                  payload = json.load(response)
              should_publish = version not in payload.get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={name}\n")
              output.write(f"version={version}\n")
              output.write(f"should_publish={str(should_publish).lower()}\n")
          PY

      - name: Upgrade packaging tools
        if: steps.package_meta.outputs.should_publish == 'true'
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        if: steps.package_meta.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.package_meta.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Skip PyPI publish
        if: steps.package_meta.outputs.should_publish != 'true'
        run: |
          echo "${{ steps.package_meta.outputs.name }} ${{ steps.package_meta.outputs.version }} already exists on PyPI; skipping publish."
