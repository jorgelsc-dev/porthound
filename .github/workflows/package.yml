name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  github-release:
    name: GitHub Release (Python distributions)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release metadata
        id: release_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_TAG="main-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          RELEASE_NAME="Main build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest
          python -m pip install .
          pytest -q

      - name: Build Python distributions
        run: python -m build

      - name: Resolve package metadata
        id: package_meta
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          name = pyproject["project"]["name"]
          version = pyproject["project"]["version"]
          should_publish = True

          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=20) as response:
                  payload = json.load(response)
              should_publish = version not in payload.get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={name}\n")
              output.write(f"version={version}\n")
              output.write(f"should_publish={str(should_publish).lower()}\n")
          PY

      - name: Resolve release assets
        id: assets
        run: |
          WHEEL_FILE="$(ls dist/*.whl | head -n1)"
          SDIST_FILE="$(ls dist/*.tar.gz | head -n1)"
          if [[ -z "${WHEEL_FILE}" || -z "${SDIST_FILE}" ]]; then
            echo "Python release assets not found"
            exit 1
          fi
          {
            echo "files<<EOF"
            echo "${WHEEL_FILE}"
            echo "${SDIST_FILE}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.assets.outputs.files }}

      - name: Dispatch PyPI publish
        if: steps.package_meta.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pypi.yml --ref "${{ github.ref_name }}"

      - name: Skip PyPI publish
        if: steps.package_meta.outputs.should_publish != 'true'
        run: |
          echo "${{ steps.package_meta.outputs.name }} ${{ steps.package_meta.outputs.version }} already exists on PyPI; skipping publish."
