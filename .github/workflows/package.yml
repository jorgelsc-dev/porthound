name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release (Python distributions)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release metadata
        id: release_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_TAG="main-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          RELEASE_NAME="Main build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest
          python -m pip install .
          pytest -q

      - name: Build Python distributions
        run: python -m build

      - name: Resolve release assets
        id: assets
        run: |
          WHEEL_FILE="$(ls dist/*.whl | head -n1)"
          SDIST_FILE="$(ls dist/*.tar.gz | head -n1)"
          if [[ -z "${WHEEL_FILE}" || -z "${SDIST_FILE}" ]]; then
            echo "Python release assets not found"
            exit 1
          fi
          {
            echo "files<<EOF"
            echo "${WHEEL_FILE}"
            echo "${SDIST_FILE}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.assets.outputs.files }}
