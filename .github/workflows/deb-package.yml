name: Debian Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deb-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend bundle
        run: npm run build
        working-directory: frontend

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Install runtime dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Build Debian package
        run: ./packaging/deb/build.sh

      - name: Resolve artifact metadata
        id: artifact_meta
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(pyproject["project"]["version"])
          PY
          )"
          ARCH="$(dpkg --print-architecture)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=porthound-deb-${VERSION}-${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "arch=${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=main-deb-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "release_name=Main Debian build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: |
            dist/deb/*.deb
            dist/deb/*.sha256
          if-no-files-found: error

      - name: Publish Debian release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/porthound-release-notes.txt <<EOF
          Debian package release for PortHound ${{ steps.artifact_meta.outputs.version }} (${{ steps.artifact_meta.outputs.arch }}).

          Download the .deb asset from this release and install or update with:

            sudo apt install ./porthound_${{ steps.artifact_meta.outputs.version }}-1_${{ steps.artifact_meta.outputs.arch }}.deb
          EOF

          gh release create "${{ steps.artifact_meta.outputs.release_tag }}" \
            dist/deb/*.deb \
            dist/deb/*.sha256 \
            --repo "${{ github.repository }}" \
            --title "${{ steps.artifact_meta.outputs.release_name }}" \
            --notes-file /tmp/porthound-release-notes.txt \
            --latest
