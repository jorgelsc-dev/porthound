name: Debian Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deb-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend bundle
        run: npm run build
        working-directory: frontend

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Install runtime dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Resolve semantic version
        id: version_meta
        run: |
          VERSION_JSON="$(python -m porthound.versioning --json)"
          printf '%s\n' "$VERSION_JSON"
          VERSION="$(python - <<'PY' "$VERSION_JSON"
          import json
          import sys

          payload = json.loads(sys.argv[1])
          print(payload["version"])
          PY
          )"
          TAG="$(python - <<'PY' "$VERSION_JSON"
          import json
          import sys

          payload = json.loads(sys.argv[1])
          print(payload["tag"])
          PY
          )"
          BUMP="$(python - <<'PY' "$VERSION_JSON"
          import json
          import sys

          payload = json.loads(sys.argv[1])
          print(payload["bump"])
          PY
          )"
          SOURCE="$(python - <<'PY' "$VERSION_JSON"
          import json
          import sys

          payload = json.loads(sys.argv[1])
          print(payload["source"])
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "bump=${BUMP}" >> "${GITHUB_OUTPUT}"
          echo "source=${SOURCE}" >> "${GITHUB_OUTPUT}"
          echo "PORTHOUND_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Build Debian package
        run: ./packaging/deb/build.sh

      - name: Resolve artifact metadata
        id: artifact_meta
        run: |
          VERSION="${{ steps.version_meta.outputs.version }}"
          ARCH="$(dpkg --print-architecture)"
          echo "name=porthound-deb-${VERSION}-${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "arch=${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${{ steps.version_meta.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          echo "release_name=PortHound ${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: |
            dist/deb/*.deb
            dist/deb/*.sha256
          if-no-files-found: error

      - name: Publish Debian release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/porthound-release-notes.txt <<EOF
          Debian package release for PortHound ${{ steps.artifact_meta.outputs.version }} (${{ steps.artifact_meta.outputs.arch }}).

          Version bump: ${{ steps.version_meta.outputs.bump }}
          Version source: ${{ steps.version_meta.outputs.source }}

          Download the .deb asset from this release and install or update with:

            sudo apt install ./porthound_${{ steps.artifact_meta.outputs.version }}-1_${{ steps.artifact_meta.outputs.arch }}.deb
          EOF

          if gh release view "${{ steps.artifact_meta.outputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.artifact_meta.outputs.release_tag }}" \
              dist/deb/*.deb \
              dist/deb/*.sha256 \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "${{ steps.artifact_meta.outputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              --title "${{ steps.artifact_meta.outputs.release_name }}" \
              --notes-file /tmp/porthound-release-notes.txt \
              --latest
          else
            gh release create "${{ steps.artifact_meta.outputs.release_tag }}" \
              dist/deb/*.deb \
              dist/deb/*.sha256 \
              --repo "${{ github.repository }}" \
              --title "${{ steps.artifact_meta.outputs.release_name }}" \
              --notes-file /tmp/porthound-release-notes.txt \
              --latest
          fi
